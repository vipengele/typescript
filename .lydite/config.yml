licence:
  policy:
    allow: [Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, MIT, Unicode-3.0]

typescript:
  # lydite's own auto-detection runs `pnpm install --frozen-lockfile` for a
  # pnpm-lock.yaml root, and a GitHub-hosted runner has no `pnpm` on PATH
  # until something installs it. `corepack enable` creates the `pnpm` shim
  # (alongside `node`/`npm`, so already on PATH); `corepack prepare
  # --activate` then eagerly downloads and verifies the exact version each
  # project's `package.json` pins via `packageManager` (ADR-0001) — the
  # `node -e` walks up from the install's own directory to the nearest
  # ancestor `package.json` carrying that field, the same resolution Corepack
  # itself does. Eager, rather than the shim's own lazy download on first
  # `pnpm` invocation, matters here: that is exactly the point at which two
  # components can race on Corepack's shared download cache and corrupt each
  # other's extraction (reproduced locally).
  #
  # Setting `typescript.install` replaces lydite's own per-workspace-root
  # install coalescing (see nodedeps.Install upstream) with this string run
  # independently by every component, so that race is this override's own to
  # avoid. The mkdir-as-mutex serializes only the two `corepack` calls,
  # releasing before `pnpm install --frozen-lockfile`, which is safe to run
  # concurrently per pnpm's own store locking.
  install: |-
    set -e
    version=$(node -e "let d=process.cwd();while(!require('fs').existsSync(d+'/package.json')||!require(d+'/package.json').packageManager){d=require('path').dirname(d)}process.stdout.write(require(d+'/package.json').packageManager.split('@')[1])")
    until mkdir /tmp/lydite-corepack-prepare.lock 2>/dev/null; do sleep 0.1; done
    trap 'rmdir /tmp/lydite-corepack-prepare.lock 2>/dev/null || true' EXIT
    corepack enable
    corepack prepare "pnpm@${version}" --activate
    rmdir /tmp/lydite-corepack-prepare.lock 2>/dev/null || true
    trap - EXIT
    pnpm install --frozen-lockfile
