# What lydite builds, tests, scans and gates in vipengele/typescript.
#
# Each project under source/ is its own pnpm workspace (ADR-0001). A component is
# the unit its build tool treats as a whole, and here that unit is one workspace
# package: turbo's `test` task fans out to each package's own
# `vitest run --coverage`, and each is its own component.
components:
  - name: core-common
    dir: source/core/packages/common
    runner: vitest

  - name: core-redaction
    dir: source/core/packages/redaction
    runner: vitest

  - name: core-observability
    dir: source/core/packages/observability
    runner: vitest
    # observability imports @vipengele/ts-core-common and @vipengele/ts-core-redaction
    # through their package.json `exports`, which point at dist/ — turbo's own test
    # task depends on `^build` (turbo.json) so CI never runs a workspace package's
    # test before its workspace dependencies are built. lydite's vitest runner has
    # no such graph, so the build runs here instead.
    depends_on: [core-common, core-redaction]
    setup:
      - sh -c 'cd "$(git rev-parse --show-toplevel)/source/core" && pnpm --filter @vipengele/ts-core-common run build'
      - sh -c 'cd "$(git rev-parse --show-toplevel)/source/core" && pnpm --filter @vipengele/ts-core-redaction run build'

  - name: ts
    dir: source/ts/packages/ts
    runner: vitest
    # ts pins and links @vipengele/ts-core-common across projects (ADR-0009); lydite's
    # vitest runner has no cross-project build graph, so the build runs here instead.
    depends_on: [core-common]
    setup:
      - sh -c 'cd "$(git rev-parse --show-toplevel)/source/core" && pnpm --filter @vipengele/ts-core-common run build'

# Each project's own vitest.shared.ts (source/<project>/vitest.shared.ts) is the
# Node+Chromium preset every package under that project imports — real TypeScript,
# but a workspace-root file no package's own `dir` contains, so it is an orphan
# under no component rather than dead code.
#
# The two new .github/actions/*/{build,verify}.sh scripts (ADR-0009) are CI
# infrastructure, not a source/ package — no component's `dir` covers them, and a
# lasting automated fixture-test suite for them is scope beyond issue #71; each was
# hand-verified against fixtures instead.
excludes:
  - "source/core/vitest.shared.ts"
  - "source/ts/vitest.shared.ts"
  - ".github/actions/build-cross-project-deps/build.sh"
  - ".github/actions/verify-cross-project-deps/verify.sh"
